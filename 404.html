<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — IntervalPro</title>
<meta name="description" content="That page is not here. Return to the IntervalPro interval timer home page.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<!-- Root-absolute paths: GitHub Pages serves this file for a missing path at ANY depth,
     where a relative href would resolve against the broken URL instead of the site root. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .err {
    min-height: calc(100vh - 160px);
    display: grid;
    place-items: center;
    text-align: center;
    padding: 60px 0;
  }
  .err-code {
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 700;
    margin-bottom: 16px;
  }
  .err h1 { font-size: clamp(1.9rem, 5vw, 3rem); margin-bottom: 14px; }
  .err p { color: var(--muted); max-width: 34em; margin: 0 auto 30px; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="IntervalPro home">
      <img src="/assets/icon-192.png" width="40" height="40" alt="" class="brand-icon">
      <span class="brand-name">IntervalPro</span>
    </a>
    <a class="btn btn-small" href="/">Home</a>
  </div>
</header>

<main class="wrap err">
  <div>
    <p class="err-code">404</p>
    <h1>This round doesn't exist.</h1>
    <p>The page you were looking for has finished its interval, or never started. Head back to the timer.</p>
    <a class="btn" href="/">Back to IntervalPro</a>
  </div>
</main>

</body>
</html>
