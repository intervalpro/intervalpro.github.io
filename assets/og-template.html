<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for assets/og-image.png. Rendered headlessly at 1200x630 by build-og.ps1.
     Not linked from the site; edit here and re-render, do not edit the PNG. -->
<title>IntervalPro — OG image source</title>
<style>
  :root {
    --bg: #0B0B0C;
    --green: #81C784;
    --work: #1B5E20;
    --muted: #B0BEC5;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: var(--bg);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    position: relative;
    overflow: hidden;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: absolute;
    width: 760px; height: 760px;
    right: -180px; top: -280px;
    background: radial-gradient(circle, rgba(129,199,132,0.22), transparent 66%);
  }
  .glow-2 {
    position: absolute;
    width: 520px; height: 520px;
    left: -160px; bottom: -260px;
    background: radial-gradient(circle, rgba(27,94,32,0.42), transparent 68%);
  }
  .top { display: flex; align-items: center; gap: 20px; position: relative; }
  .icon { width: 78px; height: 78px; border-radius: 18px; }
  .wordmark { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .mid { position: relative; }
  h1 {
    font-size: 76px;
    line-height: 1.05;
    letter-spacing: -0.035em;
    font-weight: 700;
    max-width: 900px;
  }
  h1 .accent { color: var(--green); }
  .sub {
    margin-top: 22px;
    font-size: 27px;
    color: var(--muted);
    letter-spacing: -0.005em;
  }
  .bottom { display: flex; align-items: center; gap: 16px; position: relative; }
  .pill {
    background: rgba(129,199,132,0.15);
    border: 1px solid rgba(129,199,132,0.5);
    color: var(--green);
    border-radius: 999px;
    padding: 11px 22px;
    font-size: 21px;
    font-weight: 600;
  }
  .url { color: var(--muted); font-size: 21px; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>

  <div class="top">
    <img class="icon" src="icon-192.png" alt="">
    <span class="wordmark">IntervalPro</span>
  </div>

  <div class="mid">
    <h1>Every round on time.<br><span class="accent">Nothing to count.</span></h1>
    <p class="sub">Interval timer for HIIT, boxing, circuits, CrossFit &amp; Hyrox</p>
  </div>

  <div class="bottom">
    <span class="pill">Free on Google Play</span>
    <span class="url">intervalpro.github.io</span>
  </div>
</body>
</html>
